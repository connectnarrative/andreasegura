name: Restore verified original Andrea Segura portfolio files
on:
  push:
    paths:
      - '.github/workflows/restore-portfolio-media.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: restore-original-andrea-media
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified portfolio source and staged original bytes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Reconstruct and SHA-256 verify original photographs and Face Card
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          manifest = Path("SHA256SUMS.txt").read_text(encoding="utf-8").splitlines()
          expected = {}
          for line in manifest:
              if not line.strip():
                  continue
              checksum, rel = line.split("  ", 1)
              if rel.startswith("/") or ".." in Path(rel).parts:
                  raise RuntimeError("Unsafe manifest path")
              expected[rel] = checksum
          assets = {path:digest for path,digest in expected.items()
                    if path.startswith("media/") or path == "face-card-qr.png"}
          assert len([path for path in assets if path.startswith("media/")]) == 41, "Expected 41 original portfolio photos"
          assert len(assets) == 42, "Expected photos and QR image"
          for rel, digest in assets.items():
              filename = Path(rel).name
              parts = sorted(Path(".transfer").glob(filename+".part*.txt"))
              if not parts:
                  raise RuntimeError(f"Missing staged original bytes for {rel}")
              encoded = b"".join(p.read_bytes().strip() for p in parts)
              original = base64.b64decode(encoded, validate=True)
              actual = hashlib.sha256(original).hexdigest()
              if actual != digest:
                  raise RuntimeError(f"SHA-256 MISMATCH: {rel} (refusing to publish changed imagery)")
              dest = Path(rel)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(original)
              print(f"VERIFIED {rel}, {len(original)} original bytes")
          for rel, digest in expected.items():
              path = Path(rel)
              if not path.is_file():
                  raise RuntimeError(f"Missing source asset: {rel}")
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != digest:
                  raise RuntimeError(f"MANIFEST MISMATCH: {rel}")
          print(f"SUCCESS: ALL {len(expected)} SOURCE FILES VERIFIED BYTE-FOR-BYTE")
          PY
      - name: Commit original media and remove temporary encoded transfer files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -- .transfer
          git add -- media/ face-card-qr.png
          git diff --cached --stat
          git commit -m "Restore complete Andrea Segura portfolio with 41 SHA-256 verified originals"
          git push origin HEAD:main
