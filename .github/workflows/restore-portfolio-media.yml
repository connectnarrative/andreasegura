name: Restore original Andrea Segura portfolio media
on:
  push:
    paths:
      - '.github/workflows/restore-portfolio-media.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: restore-original-andrea-media
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified portfolio source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Download original photos and QR with byte-for-byte verification
        env:
          ORIGINAL_PORTFOLIO_BASE: https://andrea-segura-portfolio.pureliveguy.chatgpt.site/
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          import time

          base = os.environ["ORIGINAL_PORTFOLIO_BASE"]
          manifest = pathlib.Path("SHA256SUMS.txt").read_text(encoding="utf-8")
          items = []
          for line in manifest.splitlines():
              if not line.strip():
                  continue
              checksum, rel = line.split("  ", 1)
              if rel == "face-card-qr.png" or rel.startswith("media/"):
                  items.append((checksum, rel))
          photos = [r for _,r in items if r.startswith("media/")]
          assert len(photos) == 41, f"Expected 41 originals, found {len(photos)}"
          print(f"Downloading {len(items)} original media files with strict SHA-256 checks")
          for expected, rel in items:
              if rel.startswith("/") or ".." in pathlib.PurePosixPath(rel).parts:
                  raise RuntimeError(f"Invalid asset path: {rel}")
              url = urllib.parse.urljoin(base, urllib.parse.quote(rel, safe="/"))
              error = None
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 (SEGURA archive verification)"})
                      with urllib.request.urlopen(request, timeout=90) as response:
                          data = response.read()
                      actual = hashlib.sha256(data).hexdigest()
                      if actual != expected:
                          raise ValueError(f"SHA-256 mismatch for {rel}: {actual} != {expected}; refusing altered data")
                      dest = pathlib.Path(rel)
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(data)
                      print(f"VERIFIED {rel} ({len(data)} bytes)")
                      error = None
                      break
                  except Exception as exc:
                      error = exc
                      if isinstance(exc, ValueError):
                          break
                      time.sleep(attempt + 1)
              if error is not None:
                  raise RuntimeError(f"Unable to safely restore {rel} from the original published source: {error}")
          PY
      - name: Validate all original media against manifest
        run: |
          grep '  media/' SHA256SUMS.txt | sha256sum --check --strict
          grep '  face-card-qr.png$' SHA256SUMS.txt | sha256sum --check --strict
      - name: Commit original verified media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- media/ face-card-qr.png
          if ! git diff --cached --quiet; then
            git commit -m "Restore 41 verified original portfolio photographs and Face Card QR"
            git push origin HEAD:main
          else
            echo "Verified media already committed"
          fi
